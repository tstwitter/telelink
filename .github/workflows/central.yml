name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: central-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos publicos
        run: |
          mkdir -p _site
          cp index.html redirect.js config.json .nojekyll _site/
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v5
