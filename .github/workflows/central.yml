name: Central de links

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: central-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  central:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      METRICS_API_URL: ${{ secrets.METRICS_API_URL }}
      METRICS_API_TOKEN: ${{ secrets.METRICS_API_TOKEN }}
      PUBLIC_BASE_URL: https://tstwitter.github.io/telelink/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Testar o controle
        run: python -m unittest discover -s tests -v
      - name: Preparar somente os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html redirect.js config.json .nojekyll _site/
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Confirmar publicação e avisar canal
        if: steps.deployment.outcome == 'success' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        run: python scripts/telegram_bot.py complete
      - name: Avisar falha
        if: failure()
        run: python scripts/telegram_bot.py failure
