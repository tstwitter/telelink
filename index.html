<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Redirecionando</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fff;color:#59636b;font:14px/1.5 system-ui,sans-serif}main{display:none;width:min(92vw,280px);text-align:center}main.visivel{display:block}h1{font-size:16px;color:#26323a;margin:0 0 8px}p{margin:0 0 14px}a,button{font:inherit}#continuar,button{display:inline-block;padding:9px 14px;border:0;border-radius:7px;background:#2aabee;color:#fff;text-decoration:none;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #26323a;outline-offset:3px}[hidden]{display:none!important}.nota{font-size:12px;margin-top:10px;color:#7b858c}
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Abrindo Telegram…</h1>
    <p id="status" role="status" aria-live="polite">Se nada acontecer, continue abaixo.</p>
    <a id="continuar" hidden rel="noreferrer">Abrir Telegram</a>
    <button id="tentar" hidden type="button">Tentar novamente</button>
    <p class="nota" id="nota" hidden>Redirecionamento seguro.</p>
    <noscript><p>Ative o JavaScript para continuar.</p></noscript>
  </main>
  <script src="redirect.js"></script>
</body>
</html>
